# AOC-DFO corpus registry
# Spec: AOC-DFO-REQ v1.0 Req 1.1, 1.4; AOC-DFO-DES v1.0 §2
# Generated: 2026-09-04. Verified against doctrine.af.mil Smart Book (4 Jul 2026),
# jcs.mil doctrine status (25 Mar 2025), USMCU JADO libguide (3 Aug 2026),
# e-publishing.af.mil, niem.gov / OASIS NIEMOpen, mimworld.org.
#
# tier values:
#   1a  public web, no login          (fully citable, ingest directly)
#   1b  UNCLASSIFIED but CAC-gated    (JEL+/JDEIS, WMA portal; citable if obtained)
#   2   distribution-controlled / CUI (never in public repo; corpus-controlled/ only)
# status values: verified | verify-date | superseded | unavailable
#
# Design note: current joint pubs are 1b (JEL+ requires CAC). Public 1a copies
# are typically the *previous* edition (FAS/DTIC mirrors). Registry lists both so
# the build can run on 1a and be upgraded to 1b without re-anchoring.

registry_version: 1
default_handling: UNCLASSIFIED

sources:

