# ------------------------------------------------------------------ Findings for Amendment 001
findings:
  - "AFDP 3-30 superseded by AFDP 3-0.1 (22 Jan 2025). Update REQ 2.1, DES §1/§2.1/§3.1."
  - "'AFDP 3-1' should be AFDP 3-01. Update DES §2.1."
  - "JP 2-01 removed from joint hierarchy; use JP 2-0 (w/Ch 1, 2024) + Joint Guide JIPOE (2022). Update DES §2.1."
  - "Current joint pubs are CAC-gated (JEL+). Introduce tier 1b; public fallbacks are previous editions. Update REQ 1 glossary and DES §2."
  - "AFMAN 13-1AOC V3 (25 Jun 2024) is publicly releasable and is the richest Tier 1 source for internal AOC flows. Elevate to primary in DES §2.1 and tasks 2.1/7.2."
  - "Prefer MIP Information Model (MIM) over JC3IEDM as secondary canonical vocabulary (DES D-1)."
  - "NIEM 6.0 is now an OASIS Open Project release; MilOps public XSDs at docs.oasis-open.org. Restricted MOMS namespace on WMA portal (CAC)."
