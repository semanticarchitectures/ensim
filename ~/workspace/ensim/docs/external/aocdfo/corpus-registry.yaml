  # ---------------------------------------------------------------- Systems
  - id: SYS-KRADOS
    title: "Kessel Run All-Domain Operations Suite (KRADOS) — AOC Block 20"
    issuer: AFLCMC Detachment 12 (Kessel Run), OpsC2 product line
    edition: "n/a (continuously delivered; MVCR1 2022)"
    tier: 1a
    status: verified
    url: https://kesselrun.af.mil/product-lines/OpsC2.html
    role: transport/implementation layer; system of record successor to TBMCS for ATO/ACO production
    notes: >
      KRADOS is the backbone of AOC Block 20. Apps connected by common data streams on hybrid cloud.
      First operational ATO built in KRADOS at 609 AOC, May 2021; 609 AOC fully off TBMCS and MAAP-TK
      after MVCR1 (Nov 2022). Being scaled to INDOPACOM AOCs (2023+). Nine applications delivered Dec 2020.
    components:
      - {name: Slapshot,       function: "Builds the Master Air Attack Plan (MAAP); used by COD",          ato_stage: "3 Weaponeering & allocation",     product: MAAP}
      - {name: Triton,         function: "Consumes other apps' data to generate the Air Tasking Order",      ato_stage: "4 ATO production & dissemination", product: ATO}
      - {name: Spacer,         function: "Airspace management; coordinates/deconflicts airspace in the AOR", ato_stage: "4 ATO production & dissemination", product: ACO}
      - {name: Jigsaw,         function: "Tanker/air refueling planning",                                   ato_stage: "3-4",                              product: "AR plan (MAAP/ATO input)"}
      - {name: MaiTai,         function: "Asset availability visibility for commanders",                    ato_stage: "3",                                product: "force availability / allocation input"}
      - {name: Rebel Alliance, function: "Event handling; communicates data between KRADOS apps",           ato_stage: "all",                              product: null, note: "internal transport, not a user-facing flow"}
      - {name: KRID,           function: "Authentication for the KRADOS suite",                             ato_stage: "n/a",                              product: null, note: "not a data flow; model as access control on the system"}
      - {name: Skyhook,        function: unknown,                                                           ato_stage: unknown,                            product: null, note: "named in the 9-app list; no public description found"}
      - {name: Direct,         function: unknown,                                                           ato_stage: unknown,                            product: null, note: "named in the 9-app list; no public description found"}
    provenance:
      - {doc: "kesselrun.af.mil OpsC2 product line page", claim: "app descriptions for Slapshot, Triton, Spacer, KRID, Rebel Alliance; TBMCS as system of record"}
      - {doc: "kesselrun.af.mil news, 'Kessel Run Deploys KRADOS' / 'KR-KRADOS-OP' (May 2021)", claim: "nine apps delivered Dec 2020; first operational MAAP/ATO at 609 AOC"}
      - {doc: "GovCIO Media (Dec 2024)", claim: "MVCR1 2022; 609 AOC off TBMCS and MAAP-TK; MaiTai description"}
      - {doc: "DefenseScoop (3 Aug 2023)", claim: "Triton ATO consolidation; INDOPACOM scaling"}
      - {doc: "Carahsoft Kessel Run page", claim: "full nine-app name list incl. Skyhook and Direct"}

